# From examples/train_lora/qwen3_lora_sft.yaml in LLaMA-Factory v0.9.5. What we changed and why:
#   model_name_or_path, template   Qwen2.5-0.5B-Instruct + its "qwen" template: small enough to train on a CPU
#   dataset, dataset_dir           our Nori rows from make_dataset.py, not the demo data
#   cutoff_len 256                 our rows are under 100 tokens
#   gradient_accumulation_steps 4  28 rows, so 7 optimizer steps per epoch
#   num_train_epochs 5, lr 2e-4    tiny data needs more passes
#   logging_steps 1, save_steps    a point on the loss curve every step; no mid-run checkpoints
#   workers 1 / 0                  worker processes are slow to start on Windows
#   bf16 false                     a CPU trains in float32
#   report_to mlflow               train_tracked.py says where

### model
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
dataset: nori_train
dataset_dir: data
template: qwen
cutoff_len: 256
preprocessing_num_workers: 1
dataloader_num_workers: 0

### output
output_dir: saves/nori/lora/sft
logging_steps: 1
save_steps: 1000
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: mlflow

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: false
