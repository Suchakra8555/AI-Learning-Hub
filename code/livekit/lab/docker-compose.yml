# The course lab: a self-hosted LiveKit you can break safely.
#   docker compose up -d                      # redis + livekit-server
#   docker compose --profile egress up -d     # + recording service
#   docker compose --profile ingress up -d    # + RTMP/WHIP/URL ingest
#   docker compose --profile sip up -d        # + SIP service
# host networking: WebRTC needs real UDP ports, and Docker's NAT gets in the way. Linux only.
services:
  redis:
    image: redis:7-alpine
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379"]
  livekit:
    image: livekit/livekit-server:v1.13.11
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]
    depends_on: [redis]
  egress:
    profiles: [egress]
    image: livekit/egress:v1.15.0
    network_mode: host
    environment: ["EGRESS_CONFIG_FILE=/etc/egress.yaml"]
    volumes: ["./egress.yaml:/etc/egress.yaml:ro", "./recordings:/out"]
    cap_add: [SYS_ADMIN]   # shortcut: docs prefer a seccomp profile for Chrome's sandbox
    depends_on: [livekit]
  ingress:
    profiles: [ingress]
    image: livekit/ingress:v1.6.0
    network_mode: host
    environment: ["INGRESS_CONFIG_FILE=/etc/ingress.yaml"]
    volumes: ["./ingress.yaml:/etc/ingress.yaml:ro"]
    depends_on: [livekit]
  sip:
    profiles: [sip]
    image: livekit/sip:v1.23.0
    network_mode: host
    volumes: ["./sip.yaml:/sip/config.yaml:ro"]   # the image runs: livekit-sip --config=/sip/config.yaml
    depends_on: [livekit]
